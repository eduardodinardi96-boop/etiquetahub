services:
  - type: web
    name: etiquetahub-javi
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: POLL_SECONDS
        value: "120"
      - key: CUTOFF_TIME
        value: "09:00"
      - key: RESET_ADMIN
        value: ""
